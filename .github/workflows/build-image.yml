name: build-image

# This job MUST run on a self-hosted runner.
#
# GitHub-hosted runners cannot build this image:
#   - no /dev/kvm (ARM64 guest runs under TCG on x86)
#   - ~14 GB free disk (the qcow2 alone is ~28 GB)
#   - 6 hour job limit
#
# Never add a `pull_request` trigger to this workflow: fork PRs would run
# arbitrary code on the self-hosted machine.

on:
  workflow_dispatch:
    inputs:
      iso_path:
        description: "Path to the Windows 11 ARM64 ISO on the runner"
        required: true
        default: "/srv/iso/Win11_ARM64_26H2.iso"
      iso_sha256:
        description: "Optional expected SHA256 of the ISO"
        required: false
        default: ""
      image_index:
        description: "WIM image index"
        required: true
        default: "1"
      virtio_iso:
        description: "Optional path to virtio-win.iso (or set the VIRTIO_ISO variable)"
        required: false
        default: ""
      size:
        description: "qcow2 virtual size (ignored when disk is set)"
        required: true
        default: "50G"
      disk:
        description: "Optional block device to write directly (wiped)"
        required: false
        default: ""
      keep_ubuntu:
        description: "Keep a small Ubuntu recovery system (needs disk)"
        required: false
        type: boolean
        default: false
      ubuntu_size:
        description: "Size of the recovery Ubuntu partition"
        required: false
        default: "4G"

  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    # Any Linux host with qemu-system-aarch64, wimlib and ~100 GB free.
    # Register the runner with the labels self-hosted,linux,tcg.
    runs-on: [self-hosted, linux, tcg]
    timeout-minutes: 720
    environment: release
    env:
      # Secrets override the built-in defaults in internal/render.py.
      WIN_USERNAME: ${{ secrets.WIN_USERNAME || 'User' }}
      WIN_PASSWORD: ${{ secrets.WIN_PASSWORD || 'oci-a1' }}
      COMPUTER_NAME: ${{ secrets.COMPUTER_NAME || vars.COMPUTER_NAME || 'OCI-WIN' }}

      ISO: ${{ inputs.iso_path || vars.ISO_PATH }}
      ISO_SHA256: ${{ inputs.iso_sha256 || vars.ISO_SHA256 }}
      IMAGE_INDEX: ${{ inputs.image_index || '1' }}
      VIRTIO_ISO: ${{ inputs.virtio_iso || vars.VIRTIO_ISO }}
      SIZE: ${{ inputs.size || '50G' }}
      DISK: ${{ inputs.disk }}
      KEEP_UBUNTU: ${{ inputs.keep_ubuntu && '1' || '0' }}
      RECOVERY_SIZE: ${{ inputs.ubuntu_size || '4G' }}

    steps:
      - uses: actions/checkout@v4

      - name: Mask credentials
        run: echo "::add-mask::$WIN_PASSWORD"

      - name: Show resolved settings
        run: |
          echo "runner=$(uname -m) cpus=$(nproc)"
          echo "iso=$ISO"
          echo "image_index=$IMAGE_INDEX"
          echo "computer_name=$COMPUTER_NAME"
          echo "user=$WIN_USERNAME"
          echo "disk=${DISK:-<qcow2>}"
          echo "keep_ubuntu=$KEEP_UBUNTU (${RECOVERY_SIZE})"

      - name: Verify ISO checksum
        if: env.ISO_SHA256 != ''
        run: |
          actual=$(sha256sum "$ISO" | awk '{print $1}')
          [ "$actual" = "$ISO_SHA256" ] || {
            echo "ISO sha256 mismatch: $actual" >&2
            exit 1
          }

      - name: Build
        run: internal/build-image.sh

      - name: Write build summary
        if: always()
        run: |
          {
            echo "### build-image"
            echo
            echo "- runner: $(uname -m), $(nproc) cpus"
            echo "- iso: $ISO"
            echo "- image index: $IMAGE_INDEX"
            echo "- computer name: $COMPUTER_NAME"
            echo "- target: ${DISK:-build/win11-arm64.qcow2}"
          } >> "$GITHUB_STEP_SUMMARY"
